name: Build aidea macOS bundle (cross-compile)

# =============================================================================
# 在 GitHub 免费的 Linux runner（ubuntu-latest，无需绑卡）上：
#   1. 用 osxcross 把 Rust 代码交叉编译成 x86_64-apple-darwin 原生二进制
#   2. 用 vite 构建前端
  #   3. 交叉编译 llama.cpp llama-server / 下载 PostgreSQL 的 macOS 预编译二进制（含其 dylib 与 share 数据）
#   4. 打成一个 aidea-bundle.tar.gz Artifact
#
# 【故意不做的事】不在这里跑 `tauri build`。
#   Linux 无法生成 macOS 的 .app/.dmg（需要 hdiutil/codesign），
#   所以封包这一步交给用户在本机 macOS 上跑仓库根的 `package-dmg.sh`。
#   用户本机的 Spotlight(mds) 已损坏导致 cargo 死锁，但 hdiutil/codesign 不依赖 mds。
#
# 产物：Actions 运行结束后在 Artifacts 区下载 `aidea-bundle`。
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      bake_model:
        description: "把 qwen2.5-0.5b.gguf 端模型权重烘焙进包（离线可用，artifact 约 +400MB）"
        type: boolean
        default: true
      osxcross_tag:
        description: "crazymax/osxcross 镜像 tag（提供 MacOSX SDK + cctools/ld64）"
        type: string
        default: "26.1-r0-ubuntu"
  push:
    branches: [main, master]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  TARGET_TRIPLE: x86_64-apple-darwin
  MACOSX_DEPLOYMENT_TARGET: "10.15"
  PG_MAJOR: "17"
  OSXCROSS_ROOT: /opt/osxcross
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  RUST_BACKTRACE: "1"

jobs:
  build-bundle:
    name: Cross-compile macOS bundle on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # -------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------------------------------------------------
      # 磁盘：osxcross SDK(~2G) + cargo target(~6G) + pg/llama-server/gguf(~1G)
      # -------------------------------------------------------------------
      - name: Free up disk space
        run: |
          set -euo pipefail
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-/nonexistent}" || true
          sudo apt-get clean || true
          echo "after:"; df -h / | tail -1

      # -------------------------------------------------------------------
      - name: Install host build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # clang/lld/libc6-dev : osxcross 工具链的宿主依赖
          # protobuf-compiler   : crates/core 的 build.rs 用 tonic-build，需要 protoc（跑在宿主）
          # 7zip / p7zip-full   : 解 Postgres.app 的 .dmg（7zz 支持 APFS，7z 兜底 HFS+）
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld llvm libc6-dev \
            protobuf-compiler pkg-config cmake \
            curl jq xz-utils zstd rsync \
            7zip p7zip-full libxml2 zlib1g-dev
          protoc --version

      # -------------------------------------------------------------------
      - name: Install Rust toolchain (+ x86_64-apple-darwin target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      # Swatinem/rust-cache 会自动裁剪 target/ 中的中间产物，避免撑爆 10GB 仓库缓存配额
      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-darwin-cross
          key: ${{ env.TARGET_TRIPLE }}
          cache-on-failure: true

      # -------------------------------------------------------------------
      # osxcross：从 crazymax/osxcross 镜像里拷出整套工具链（含 MacOSX SDK）。
      # 该镜像 linux/amd64 变体把工具链放在 /osxcross（bin/ lib/ SDK/），
      # 部分变体把 SDK 单独放在 /osxsdk —— 两种都兼容处理。
      #
      # 【踩过的两个坑】
      #   1) run 早期：这一步卡死 48 分钟、日志零输出。原因是 GitHub runner
      #      走共享出口 IP 匿名拉 Docker Hub，一旦触发 429 限流，dockerd 会
      #      静默指数退避重试 —— 既不报错也不打印新进度，一路挂到 job 超时。
      #   2) run #5：72 秒内三次拉取全败。原因是上游把 `14.5-r0-ubuntu`
      #      标签下架了（Docker Hub 现只剩 26.1-* / edge / latest），
      #      并且 IMAGES 里的 GHCR 命名空间写错成 `ghcr.io/crazy-max/...`
      #      （多了连字符，正确的是 `ghcr.io/crazymax/...`）还重复列了两次，
      #      等于三次尝试里有两次注定 404。
      #
      # 【当前策略】
      #   1) 默认 tag 用 26.1-r0-ubuntu（Docker Hub 上已确认存在）；
      #   2) 镜像源优先 Docker Hub（该 tag 确认有），GHCR 用修正后的命名空间兜底；
      #   3) 每次尝试整体包在 `timeout 600` 里 —— 卡住就快速失败而不是干等，
      #      最多 3 次尝试（间隔递增 sleep），总耗时上界 ~31 分钟；
      #   4) 每次尝试失败都单独打一条 `::error::`，带 registry / rc / 抓到的
      #      stderr 末尾，这样无需鉴权也能从 Actions 页面看清是哪个源、为什么挂；
      #   5) 解好的工具链用 actions/cache 按 tag 缓存，后续 run 秒级命中，
      #      完全不碰 registry。
      # -------------------------------------------------------------------
      - name: Resolve osxcross tag
        id: osxcross
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.osxcross_tag || '26.1-r0-ubuntu' }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "osxcross tag = ${TAG}"

      # actions/cache 以 runner 用户身份读写 /opt/osxcross，
      # 必须先把目录建好并交出属主，否则 restore/save 会因权限失败。
      - name: Prepare osxcross directory
        run: |
          set -euo pipefail
          sudo mkdir -p "$OSXCROSS_ROOT"
          sudo chown -R "$(id -u):$(id -g)" "$OSXCROSS_ROOT"

      - name: Cache osxcross toolchain
        id: osxcross-cache
        uses: actions/cache@v4
        with:
          path: /opt/osxcross
          key: osxcross-${{ runner.os }}-${{ steps.osxcross.outputs.tag }}-v1

      - name: Fetch osxcross toolchain (MacOSX SDK + cctools/ld64)
        if: steps.osxcross-cache.outputs.cache-hit != 'true'
        env:
          OSXCROSS_TAG: ${{ steps.osxcross.outputs.tag }}
        run: |
          # GitHub 默认 bash 是 `bash -eo pipefail`，-e 始终开着。显式关掉 -e，
          # 保留 pipefail 以便正确取退出码；重试逻辑自行判断 rc。
          set +e -o pipefail
          # 该 trap 只用于「真正意外」的失败。所有**诊断性**命令必须显式 `|| true`，
          # 否则会像 run #13 那样报出一条说不清的 FETCH_UNCAUGHT 干扰后续排查。
          trap 'echo "::error::FETCH_UNCAUGHT rc=$? line=$LINENO"' ERR

          echo "disk before: $(df -h / | tail -1)"

          if ! command -v docker >/dev/null 2>&1; then
            echo "::error::docker binary NOT FOUND on runner"
            exit 1
          fi
          HAVE_TIMEOUT=1
          command -v timeout >/dev/null 2>&1 || HAVE_TIMEOUT=0

          PULL_LOG=/tmp/osxcross-pull.log
          : > "$PULL_LOG"

          IMAGES=(
            "docker.io/crazymax/osxcross:${OSXCROSS_TAG}"
            "docker.io/crazymax/osxcross:${OSXCROSS_TAG}"
            "docker.io/crazymax/osxcross:${OSXCROSS_TAG}"
          )
          MAX_ATTEMPTS=3
          BACKOFF=(15 30 0)

          mkdir -p "$OSXCROSS_ROOT"

          ok=0
          for (( attempt = 1; attempt <= MAX_ATTEMPTS; attempt++ )); do
            image="${IMAGES[$(( attempt - 1 ))]}"
            echo "::group::attempt ${attempt}/${MAX_ATTEMPTS} — ${image} (hard timeout 600s)"
            rm -rf "${OSXCROSS_ROOT:?}"/* "${OSXCROSS_ROOT:?}"/.[!.]* 2>/dev/null || true
            : > "$PULL_LOG"

            # 该镜像无 /bin/sh（distroless 风格），不能 docker run ... /bin/sh -c。
            # 改用 docker create + docker cp：create 时给占位命令 true（Docker 在 create
            # 阶段不校验命令是否存在、我们也永不启动该容器），再用 docker cp 直接从
            # 镜像层拷出 /osxcross（与 /osxsdk）；docker cp 不需要容器内 shell。
            if [ "$HAVE_TIMEOUT" -eq 1 ]; then
              CID="$(timeout --signal=TERM --kill-after=60 600 docker create --platform linux/amd64 "$image" true 2>>"$PULL_LOG")"
            else
              CID="$(docker create --platform linux/amd64 "$image" true 2>>"$PULL_LOG")"
            fi
            rc=$?

            if [ "$rc" -eq 0 ] && [ -n "$CID" ]; then
              docker cp "$CID:/osxcross/." "$OSXCROSS_ROOT/" 2>>"$PULL_LOG" || rc=1
              if [ "$rc" -eq 0 ] && ! ls -d "$OSXCROSS_ROOT"/SDK/MacOSX*.sdk >/dev/null 2>&1; then
                mkdir -p "$OSXCROSS_ROOT/SDK"
                docker cp "$CID:/osxsdk/." "$OSXCROSS_ROOT/SDK/" 2>>"$PULL_LOG" || true
              fi
              docker rm -f "$CID" >/dev/null 2>&1 || true
            else
              echo "docker create failed (rc=$rc) for ${image}" >> "$PULL_LOG"
              [ -n "$CID" ] && docker rm -f "$CID" >/dev/null 2>&1 || true
            fi

            sdk_ok=0
            if [ -d "$OSXCROSS_ROOT/SDK" ] && ls -d "$OSXCROSS_ROOT"/SDK/MacOSX*.sdk >/dev/null 2>&1; then
              if [ -d "$OSXCROSS_ROOT/bin" ] \
                 && { ls "$OSXCROSS_ROOT"/bin/o64-clang >/dev/null 2>&1 \
                      || ls "$OSXCROSS_ROOT"/bin/*-apple-darwin*-clang >/dev/null 2>&1; }; then
                sdk_ok=1
              fi
            fi

            if [ "$rc" -eq 0 ] && [ "$sdk_ok" -eq 1 ]; then
              echo "attempt ${attempt} succeeded"
              ok=1
              echo "::endgroup::"
              break
            fi

            if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
              echo "attempt ${attempt} TIMED OUT after 600s (registry stall / rate limit)"
            else
              echo "attempt ${attempt} failed with exit code ${rc}"
            fi
            echo "::endgroup::"

            last_error="$(tail -n 8 "$PULL_LOG" 2>/dev/null | tr -d '\r' | tr '\n' ' ' | tr -s ' ' | cut -c1-900)"
            if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
              last_error="timed out after 600s; ${last_error}"
            fi
            echo "::error::osxcross attempt ${attempt} registry=${image} rc=${rc} last_error=${last_error:-unknown}"

            sleep "${BACKOFF[$(( attempt - 1 ))]}"
          done

          if [ "$ok" -ne 1 ]; then
            echo "::error::osxcross 工具链拉取失败：${MAX_ATTEMPTS} 次尝试全部未成功（tag=${OSXCROSS_TAG}）。逐次失败原因见上面每条 attempt 的 ::error::。"
            exit 1
          fi

          echo "disk after: $(df -h / | tail -1)"
          echo "--- osxcross/bin (head) ---"
          # `ls | head -40`：head 读满 40 行就关闭管道，GNU coreutils 的 ls 遇到
          # EPIPE 会打印 "write error: Broken pipe" 并以 rc=2 退出；叠加 pipefail
          # 后整条管线 rc=2，触发上面的 ERR trap ⇒ run #13 里那条
          # `FETCH_UNCAUGHT rc=2 line=97`（脚本第 97 行正是本行）。
          # 本步骤 set +e，所以 step 结论仍是 success —— 一条自相矛盾的 failure 注解。
          # 这是纯诊断输出，显式吞掉退出码即可（`|| true` 同时抑制 ERR trap）。
          { ls "$OSXCROSS_ROOT/bin" 2>/dev/null | head -40; } || true
          echo "--- SDK ---"
          ls -d "$OSXCROSS_ROOT"/SDK/* || true

      # -------------------------------------------------------------------
      - name: Configure cross-compilation environment
        run: |
          set -euo pipefail

          SDK_DIR="$(ls -d "$OSXCROSS_ROOT"/SDK/MacOSX*.sdk 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$SDK_DIR" ]; then
            echo "::error::osxcross 镜像里找不到 MacOSX SDK（期望 $OSXCROSS_ROOT/SDK/MacOSX*.sdk）"
            exit 1
          fi

          # osxcross 的归档/工具带 darwin 版本前缀，如 x86_64-apple-darwin23.5-ar
          AR_BIN="$(ls "$OSXCROSS_ROOT"/bin/x86_64-apple-darwin*-ar 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$AR_BIN" ]; then
            echo "::error::osxcross 缺少 x86_64-apple-darwin*-ar"
            exit 1
          fi
          PREFIX="${AR_BIN%-ar}"

          # o64-clang / o64-clang++ 是版本无关的包装器，已内置 -arch x86_64 与 sysroot
          CLANG="$OSXCROSS_ROOT/bin/o64-clang"
          CLANGXX="$OSXCROSS_ROOT/bin/o64-clang++"
          [ -x "$CLANG" ]   || CLANG="${PREFIX}-clang"
          [ -x "$CLANGXX" ] || CLANGXX="${PREFIX}-clang++"

          echo "$OSXCROSS_ROOT/bin" >> "$GITHUB_PATH"
          {
            echo "LD_LIBRARY_PATH=$OSXCROSS_ROOT/lib:${LD_LIBRARY_PATH:-}"
            echo "SDKROOT=$SDK_DIR"
            echo "OSXCROSS_SDK=$SDK_DIR"
            echo "OSXCROSS_PREFIX=$PREFIX"
            echo "MACOSX_DEPLOYMENT_TARGET=${MACOSX_DEPLOYMENT_TARGET}"
            # cc / cmake crates 走 target 专属变量，避免污染宿主编译
            echo "CC_x86_64_apple_darwin=$CLANG"
            echo "CXX_x86_64_apple_darwin=$CLANGXX"
            echo "AR_x86_64_apple_darwin=${PREFIX}-ar"
            echo "RANLIB_x86_64_apple_darwin=${PREFIX}-ranlib"
            echo "STRIP_x86_64_apple_darwin=${PREFIX}-strip"
            echo "CFLAGS_x86_64_apple_darwin=-isysroot $SDK_DIR -mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET}"
            echo "CXXFLAGS_x86_64_apple_darwin=-isysroot $SDK_DIR -mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET}"
            # cargo 链接器
            echo "CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER=$CLANG"
            echo "CARGO_TARGET_X86_64_APPLE_DARWIN_AR=${PREFIX}-ar"
            # 少数 crate（ring 等）只认无后缀的 TARGET_* 变量
            echo "TARGET_CC=$CLANG"
            echo "TARGET_CXX=$CLANGXX"
            echo "TARGET_AR=${PREFIX}-ar"
            echo "LIBZ_SYS_STATIC=1"
          } >> "$GITHUB_ENV"

          echo "SDKROOT = $SDK_DIR"
          echo "PREFIX  = $PREFIX"
          "$CLANG" --version || true

      - name: Smoke-test osxcross (compile a trivial macOS binary)
        run: |
          set -euo pipefail
          printf 'int main(void){return 0;}\n' > /tmp/probe.c
          "$CC_x86_64_apple_darwin" /tmp/probe.c -o /tmp/probe.macho
          file /tmp/probe.macho
          file /tmp/probe.macho | grep -qi "Mach-O" \
            || { echo "::error::osxcross 未产出 Mach-O，交叉工具链不可用"; exit 1; }

      # -------------------------------------------------------------------
      # 前瞻探针：逐个 framework 试链，提前暴露 "framework not found"。
      #
      # 为什么值得单开一步（到第 14 轮的教训）：
      #   * `cargo check` 只做类型检查 / 名字解析（产出 .rmeta，不做 codegen），
      #     按其能力边界**永远拦不住链接期错误**；到目前为止 `ld:` /
      #     `framework not found` / `Undefined symbols` 一次都没命中过。
      #   * 真正的 Tauri v2 ↔ osxcross framework 链接碰撞，只会发生在 step
      #     "Cross-compile Rust"，而那一步在 llama-server / PostgreSQL / 模型权重三个
      #     大下载之后，单次代价 9~10 分钟。等编译错误清零后第一次撞上它，
      #     又得白烧一整轮。
      #   * 本探针只花 1~2 秒，且**完全不依赖 Rust 代码编译通过**，就能在流水线
      #     最前面拿到「SDK 里哪些 framework 可链、哪些缺失」的完整清单。
      #
      # 设计要点：
      #   * 逐个 framework 单独 -framework 链接一个 trivial 程序、单独汇报，
      #     绝不一次性全传 —— 否则一个缺失就整体失败、看不出到底缺哪个。
      #   * 这是**前瞻探测不是门禁**：单个失败只记 ::warning:: 且 `|| true`，
      #     不阻断 job。只有当**全部**失败（说明 SDK 严重损坏 / SDKROOT 没配对）
      #     才升级为 ::error:: 并让步骤失败。
      #   * framework 清单覆盖 Tauri v2 GUI 运行时依赖：
      #       - WebKit    : wry 的 WKWebView（前端渲染核心）
      #       - AppKit    : tao 的窗口 / 菜单 / 事件循环（NSApplication）
      #       - Security / CoreFoundation / Foundation : 基础运行时 & 钥匙串
      #       - CoreGraphics / QuartzCore : 绘制 / 图层
      #       - CoreServices / SystemConfiguration : 文件类型 / 网络可达性
      #       - IOKit     : 电源 / 设备信息（tao 依赖）
      #       - Carbon    : tao 的全局快捷键 / 旧事件 API（HIToolbox）
      #     宁可多试几个 —— 探针便宜，信息无价。
      # -------------------------------------------------------------------
      - name: Probe Tauri frameworks against osxcross SDK (forward-looking, non-gating)
        run: |
          # 探针步骤，绝不因单个 framework 缺失而拖垮整个 job：显式关 -e。
          set +e -o pipefail

          printf 'int main(void){return 0;}\n' > /tmp/fwprobe.c

          FRAMEWORKS=(
            WebKit AppKit Security CoreFoundation Foundation
            CoreGraphics CoreServices SystemConfiguration IOKit
            Carbon QuartzCore
          )

          ok_list=""
          fail_list=""
          n_ok=0
          n_fail=0

          for fw in "${FRAMEWORKS[@]}"; do
            out="$("$CC_x86_64_apple_darwin" /tmp/fwprobe.c -framework "$fw" \
                    -o "/tmp/fwprobe.$fw" 2>&1)"
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "  [OK]   -framework $fw"
              ok_list="${ok_list:+$ok_list }$fw"
              n_ok=$((n_ok + 1))
            else
              # 只截取最有信息量的一行（ld / clang 的 not found 提示）。
              reason="$(printf '%s\n' "$out" \
                        | grep -aiE 'framework not found|ld:|clang: error:' \
                        | head -1 | tr -d '\r' | cut -c1-300)"
              [ -n "$reason" ] || reason="rc=$rc（详见 job log）"
              echo "  [FAIL] -framework $fw — $reason"
              # 前瞻探测：单个失败仅 warning，不阻断。
              echo "::warning::framework_probe FAIL -framework ${fw}: ${reason}"
              fail_list="${fail_list:+$fail_list }$fw"
              n_fail=$((n_fail + 1))
            fi
            rm -f "/tmp/fwprobe.$fw" 2>/dev/null || true
          done

          echo "framework_probe summary: ${n_ok} OK / ${n_fail} FAIL (total ${#FRAMEWORKS[@]})"
          echo "::warning::framework_probe OK(${n_ok})=[${ok_list:-none}] FAIL(${n_fail})=[${fail_list:-none}]"

          # 全部失败 ⇒ SDK / SDKROOT 有严重问题，升级为 error 并让本步骤失败，
          # 这样能在三大下载之前就把「链接根本不可用」的信号顶到最前面。
          if [ "$n_ok" -eq 0 ]; then
            echo "::error::framework_probe 全部 ${#FRAMEWORKS[@]} 个 framework 链接失败 —— osxcross SDK 或 SDKROOT 配置存在严重问题（不是单个 framework 缺失）。"
            exit 1
          fi
          # 部分失败不阻断：留待 Cross-compile 步骤据实际依赖判定。
          exit 0

      # -------------------------------------------------------------------
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Build frontend (vite -> gui/dist)
        working-directory: gui
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
          npm run build
          echo "--- gui/dist ---"
          find dist -type f | head -40
          [ -f dist/index.html ] || { echo "::error::前端构建未产出 dist/index.html"; exit 1; }

      # -------------------------------------------------------------------
      # 先放 sidecar 占位文件：tauri-build 在编译期会校验 externalBin 是否存在。
      # 真实二进制会在后续步骤覆盖它们。
      # -------------------------------------------------------------------
      - name: Create sidecar placeholders (satisfy tauri-build externalBin check)
        run: |
          set -euo pipefail
          mkdir -p gui/src-tauri/bin
          for n in aidea llama-server postgres initdb pg_ctl psql; do
            f="gui/src-tauri/bin/${n}-${TARGET_TRIPLE}"
            [ -s "$f" ] || printf '#!/bin/sh\nexit 0\n' > "$f"
            chmod +x "$f"
          done
          ls -la gui/src-tauri/bin

      # -------------------------------------------------------------------
      # 快速前端检查：在昂贵的下载 / 构建之前，先用 cargo check 把 Rust 侧的
      # 编译期错误一次性抖出来。
      #
      # 为什么卡在这个位置（前后都不能挪）：
      #   * 必须在 "Configure cross-compilation environment" 之后 —— 那一步把
      #     CC_/AR_/RANLIB_/LINKER/SDKROOT 写进 $GITHUB_ENV，后续步骤才继承得到；
      #   * 必须在 "Build frontend" + "Create sidecar placeholders" 之后 ——
      #     tauri-build 的 build.rs 会校验 frontendDist 与 externalBin 是否存在，
      #     少任何一个都会报出与真实代码无关的假错误；
      #   * 又必须在 llama-server / PostgreSQL / 模型权重三个大下载之前 —— 一旦 Rust
      #     编不过，那几百 MB 下载（模型权重单条 --max-time 900）加几十分钟的
      #     LTO release 构建就全白跑了。
      #
      # 能力边界：cargo check 只做到类型检查 / 名字解析（产出 .rmeta，不做
      # codegen），因此拦得住 E0255/E0432/E0425/E0117 这类错误，拦不住链接期
      # 错误 —— 后者仍由下面的 "Cross-compile Rust" 步骤兜底。
      # -------------------------------------------------------------------
      - name: Fast frontend check (cargo check, fail early with annotations)
        # 双保险层 1（覆盖顶层 env 的 CARGO_TERM_COLOR: always）：
        # run #14 因全局 `always` 让 --message-format=short 的诊断行被 ANSI 色码
        # 包住，annotate 脚本的位置正则集体失配、file:line:col 全丢。这里在 step
        # 级强制 never，从源头产出无色诊断；annotate 脚本内部另有剥色兜底（层 2）。
        env:
          CARGO_TERM_COLOR: never
        run: |
          # 与其它加固步骤一致：显式关 -e，保留 pipefail 以便取管道退出码。
          set +e -o pipefail
          # 诊断命令一律 `|| true`，否则会误触发这个 trap（参见 fetch 步骤的
          # `ls | head` EPIPE 教训）。
          trap 'echo "::error::CHECK_UNCAUGHT rc=$? line=$LINENO"' ERR

          CHECK_LOG=/tmp/cargo-check.log
          : > "$CHECK_LOG"

          echo "::group::cargo check --release --target ${TARGET_TRIPLE} --message-format=short"
          # 放进 if 条件里执行：bash 不会为「条件上下文中的命令」触发 ERR trap，
          # 从而避免失败时先冒出一条自相矛盾的 CHECK_UNCAUGHT 注解。
          rc=0
          if ! cargo check --release --target "$TARGET_TRIPLE" \
                 -p aidea -p aidea-gui \
                 --message-format=short 2>&1 | tee -a "$CHECK_LOG"; then
            rc="${PIPESTATUS[0]}"
            # 万一是 tee 失败而 cargo 成功，也要保证 rc 非 0
            if [ "$rc" -eq 0 ]; then rc=1; fi
          fi
          echo "::endgroup::"

          if [ "$rc" -ne 0 ]; then
            bash scripts/ci/annotate-cargo-errors.sh "$CHECK_LOG" cargo_check
            echo "::error::cargo_check_failed rc=$rc —— Rust 侧编译错误，已跳过后续下载与 release 构建。逐条 file:line 见上面的 cargo_check[batch N] 注解。"
            exit "$rc"
          fi

          echo "cargo check 通过：类型 / 名字解析层面无错误（链接期错误仍需 release 构建验证）。"
          # -e 已关闭，显式以 0 结束，避免最后一条命令的退出码误判本步骤
          exit 0

      # 无论成败都上传：失败时留错误上下文；成功时的 10 条 warning 列表同样有
      # 排查价值（谁引入了未使用 import / dead_code），而本日志才 ~5 KB，白留。
      - name: Upload cargo check log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-check-log
          path: /tmp/cargo-check.log
          if-no-files-found: ignore
          retention-days: 7

      # -------------------------------------------------------------------
      - name: Build llama.cpp llama-server (cross-compile via osxcross)
        env:
          LLAMACPP_TAG: b1056
        run: |
          set -euo pipefail
          mkdir -p .bundle/bin
          WORK="$(mktemp -d)"
          echo "::group::clone llama.cpp @ ${LLAMACPP_TAG}"
          git clone --depth 1 --branch "${LLAMACPP_TAG}" https://github.com/ggml-org/llama.cpp "$WORK/llama.cpp"
          echo "::endgroup::"
          cd "$WORK/llama.cpp"

          # 决策 B：用 osxcross 交叉编译 llama-server（OpenAI 兼容本地推理后端），替代 ollama。
          # 健壮性修复（run #23 黑盒失败复盘）：
          #   1) 不再依赖 osxcross 镜像隐式 CMAKE_TOOLCHAIN_FILE（路径缺失即 fatal，且黑盒），
          #      改为显式指定编译器 / sysroot / 架构 / deployment target。这些变量由 CI
          #      在 line 281-292 写入 $GITHUB_ENV：CLANG=o64-clang、CLANGXX=o64-clang++、
          #      SDKROOT=MacOSX SDK 路径。
          #   2) BLAS / Accelerate / Metal 全关，纯 CPU 编译。交叉编译下 find_package(Accelerate)
          #      易因 framework search path 错位而失败；纯 CPU 仍走 AVX2，qwen2.5-0.5b 足够快。
          #   3) 用 set +e + tee 捕获 cmake 输出，失败时把日志尾 emit 成 ::error:: 注解，
          #      让下次 CI 不再黑盒（见下方 rc1 / rc2 检查与 tail 输出）。
          set +e
          cmake -S . -B build \
            -DCMAKE_SYSTEM_NAME=Darwin \
            -DCMAKE_C_COMPILER="$CLANG" \
            -DCMAKE_CXX_COMPILER="$CLANGXX" \
            -DCMAKE_OSX_SYSROOT="$SDKROOT" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_METAL=OFF \
            -DLLAMA_BLAS=OFF \
            -DLLAMA_ACCELERATE=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            2>&1 | tee /tmp/llama-cfg.log
          rc1=${PIPESTATUS[0]}
          cmake --build build --config Release --target llama-server -j"$(nproc 2>/dev/null || echo 4)" \
            2>&1 | tee /tmp/llama-build.log
          rc2=${PIPESTATUS[0]}
          set -e
          if [ "$rc1" -ne 0 ] || [ "$rc2" -ne 0 ]; then
            echo "::error::llama.cpp build failed (configure_rc=${rc1} build_rc=${rc2})"
            echo "----- cmake configure tail (last 50 lines) -----"
            tail -n 50 /tmp/llama-cfg.log
            echo "----- cmake build tail (last 50 lines) -----"
            tail -n 50 /tmp/llama-build.log
            exit 1
          fi

          # 原 BIN 检查 + 拷贝逻辑（保留）
          BIN="$(find build -type f -name llama-server | head -1)"
          if [ -z "$BIN" ]; then
            echo "::error::llama-server 二进制未产出，交叉编译失败"
            exit 1
          fi
          cp "$BIN" ".bundle/bin/llama-server-${TARGET_TRIPLE}"
          chmod +x ".bundle/bin/llama-server-${TARGET_TRIPLE}"
          file ".bundle/bin/llama-server-${TARGET_TRIPLE}" || true
          rm -rf "$WORK"

      # -------------------------------------------------------------------
      # PostgreSQL：取 Postgres.app 的 macOS 构建。
      # 关键点：它的 bin 里的可执行文件用 @loader_path/../lib 引用 dylib，
      # 并按 <exe>/../share 找 initdb 模板，所以必须连 lib/ 与 share/ 一起打包，
      # 且在 .app 内保持 bin / lib / share 同级（都放 Contents/Resources 下）。
      #
      # 备选源（若 Postgres.app 下载不稳）：
      #   * https://get.enterprisedb.com/postgresql/postgresql-17.x-1-osx-binaries.zip
      #   * https://github.com/theseus-rs/postgresql-binaries/releases (x86_64-apple-darwin tar.gz)
      # -------------------------------------------------------------------
      - name: Download & extract PostgreSQL macOS binaries (Postgres.app)
        run: |
          set -euo pipefail
          mkdir -p .bundle/bin .bundle/lib .bundle/share
          WORK="$(mktemp -d)"

          API="https://api.github.com/repos/PostgresApp/PostgresApp/releases/latest"
          DMG_URL="$(curl -fsSL -H 'Accept: application/vnd.github+json' "$API" \
            | jq -r --arg v "-${PG_MAJOR}.dmg" \
                '[.assets[]?|select(.name|endswith($v))|.browser_download_url][0] // empty' || true)"
          if [ -z "$DMG_URL" ]; then
            echo "::warning::未从 API 解析到 Postgres-*-${PG_MAJOR}.dmg，回退到已知版本"
            DMG_URL="https://github.com/PostgresApp/PostgresApp/releases/download/v2.9.5/Postgres-2.9.5-17.dmg"
          fi
          echo "postgres dmg: $DMG_URL"

          if ! curl -fL --retry 3 --retry-delay 5 -o "$WORK/pg.dmg" "$DMG_URL"; then
            echo "::warning::Postgres.app 下载失败，包内将缺少 postgres（GUI 会在启动阶段报数据库不可用）"
            rm -rf "$WORK"; exit 0
          fi

          extract() {  # $1=archive $2=outdir
            if command -v 7zz >/dev/null 2>&1 && 7zz x -y -o"$2" "$1" >/dev/null 2>&1; then return 0; fi
            if command -v 7z  >/dev/null 2>&1 && 7z  x -y -o"$2" "$1" >/dev/null 2>&1; then return 0; fi
            return 1
          }

          mkdir -p "$WORK/x1"
          extract "$WORK/pg.dmg" "$WORK/x1" || echo "第一层解包返回非零（常见，继续找内层分区）"
          PGBIN="$(find "$WORK/x1" -type d -path "*/Versions/${PG_MAJOR}/bin" | head -1 || true)"

          # dmg 内层通常是一个 HFS+/APFS 分区镜像，需要再解一层
          if [ -z "$PGBIN" ]; then
            IMG="$(find "$WORK/x1" -maxdepth 2 -type f \( -name '*.hfs' -o -name '*.hfsx' -o -name '*.apfs' -o -name '*.img' -o -name '*.dmg' \) | head -1 || true)"
            if [ -n "$IMG" ]; then
              mkdir -p "$WORK/x2"
              extract "$IMG" "$WORK/x2" || true
              PGBIN="$(find "$WORK/x2" -type d -path "*/Versions/${PG_MAJOR}/bin" | head -1 || true)"
            fi
          fi

          if [ -z "$PGBIN" ]; then
            echo "::warning::未能从 dmg 中提取 Postgres.app/Contents/Versions/${PG_MAJOR}/bin"
            find "$WORK" -maxdepth 4 -type d | head -40
            rm -rf "$WORK"; exit 0
          fi

          PGROOT="$(dirname "$PGBIN")"
          echo "postgres root: $PGROOT"

          # 4 个 sidecar 按 Tauri 约定带 triple 后缀
          for tool in postgres initdb pg_ctl psql; do
            if [ -f "$PGBIN/$tool" ]; then
              cp "$PGBIN/$tool" ".bundle/bin/${tool}-${TARGET_TRIPLE}"
              chmod +x ".bundle/bin/${tool}-${TARGET_TRIPLE}"
              echo "  + $tool"
            else
              echo "::warning::Postgres.app 内缺少 $tool"
            fi
          done
          # initdb 会 exec `postgres --boot`，pg_ctl 会 exec `postgres`；顺带带上常用辅助工具
          for extra in pg_controldata pg_resetwal pg_isready pg_dump pg_restore; do
            if [ -f "$PGBIN/$extra" ]; then cp "$PGBIN/$extra" ".bundle/bin/$extra"; fi
          done

          # 运行时依赖：dylib 与 share 数据
          if [ -d "$PGROOT/lib" ];   then rsync -a "$PGROOT/lib/"   .bundle/lib/;   else echo "::warning::Postgres.app 无 lib/"; fi
          if [ -d "$PGROOT/share" ]; then rsync -a "$PGROOT/share/" .bundle/share/; else echo "::warning::Postgres.app 无 share/"; fi

          echo "bundled lib:   $(du -sh .bundle/lib   2>/dev/null | cut -f1)"
          echo "bundled share: $(du -sh .bundle/share 2>/dev/null | cut -f1)"
          rm -rf "$WORK"

      # -------------------------------------------------------------------
      - name: Bake on-device model weights (optional, best-effort)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.bake_model }}
        run: |
          set -euo pipefail
          DST="gui/src-tauri/resources/models/nes-tab/qwen2.5-0.5b.gguf"
          mkdir -p "$(dirname "$DST")"
          if [ -f "$DST" ]; then
            echo "已存在，跳过下载"
            # 兼容：确保 aidea 期望的内置权重别名 nes-tab.gguf 存在
            NES_DST="$(dirname "$DST")/nes-tab.gguf"
            if [ ! -f "$NES_DST" ]; then cp "$DST" "$NES_DST"; fi
            exit 0
          fi

          # Modelfile 里写的是 `FROM ./qwen2.5-0.5b.gguf`，必须与 Modelfile 同目录同名
          URLS="
          https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
          https://hf-mirror.com/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
          https://huggingface.co/bartowski/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf
          "
          ok=0
          for u in $URLS; do
            echo "try: $u"
            if curl -fL --retry 2 --retry-delay 5 --max-time 900 -o "$DST.part" "$u"; then
              # GGUF 魔数校验，避免把 HTML 错误页当成权重打进包
              if head -c 4 "$DST.part" | grep -q "GGUF"; then
                mv "$DST.part" "$DST"; ok=1; break
              fi
              echo "下载内容不是 GGUF，丢弃"
            fi
            rm -f "$DST.part"
          done
          # 对齐 aidea 侧 BUNDLED_MODEL_RESOURCE（models/nes-tab/nes-tab.gguf，见
          # gui/src-tauri/src/bootstrap/llamacpp.rs）：把已下载的 qwen2.5-0.5b.gguf
          # 复制一份为 nes-tab.gguf，作为内置权重别名。保留原文件名以兼容 verify-payload.sh
          # 与 MANIFEST 的引用，无需改动其余 CI 步骤；aidea 端据此命中内置 GGUF。
          NES_DST="$(dirname "$DST")/nes-tab.gguf"
          if [ "$ok" = 1 ] && [ -f "$DST" ] && [ ! -f "$NES_DST" ]; then
            cp "$DST" "$NES_DST"
            echo "端模型别名已生成：$(du -h "$NES_DST" | cut -f1) -> $NES_DST"
          fi
          if [ "$ok" = 1 ]; then
            echo "端模型权重已烘焙：$(du -h "$DST" | cut -f1)"
          else
            echo "::warning::端模型权重下载失败，包将退化为「本地未烘焙 GGUF 时由 llama-server 从资源目录加载」模式"
          fi

      # -------------------------------------------------------------------
      # 三大下载的**分项断言**（run #17 新增）。
      #
      # 为什么必须有这一步：上面三个下载步骤的所有失败路径都是
      # `::warning::` + `exit 0` —— 下载失败时步骤照样 success。run #16 里
          # llama-server 构建 / PostgreSQL 4s / 模型权重 11s 三步全绿、artifact 586.22 MiB，
      # 但这个总量**无法归因到具体哪一项**，"三步绿" 并不证明三样东西都在包里。
      # 本步骤把隐式 warning 变成显式断言，并把分项体积打进注解。
      #
      # 位置：刻意放在 "Cross-compile Rust" **之前**。缺件就立刻失败，
      #       不必先白烧 142s 的 LTO 构建（沿用 Fast frontend check 的同款思路）。
      #
          # 口径：llama-server / PostgreSQL 缺失 ⇒ 硬失败（后端栈必需）；
      #       模型权重维持 best-effort，但注解里必须明确 BAKED / SKIPPED。
      # -------------------------------------------------------------------
      - name: Verify downloaded payload components (llama-server / postgres / model)
        run: |
          set +e -o pipefail
          trap 'echo "::error::PAYLOAD_VERIFY_UNCAUGHT rc=$? line=$LINENO"' ERR

          rc=0
          bash scripts/ci/verify-payload.sh \
            .bundle \
            "gui/src-tauri/resources/models/nes-tab/qwen2.5-0.5b.gguf" \
            .ci-facts || rc=$?

          exit "$rc"

      # -------------------------------------------------------------------
      - name: Cross-compile Rust (aidea + aidea-gui) for x86_64-apple-darwin
        # 双保险层 1（覆盖顶层 CARGO_TERM_COLOR: always）：同 Fast frontend check，
        # 强制无色诊断，保证 --message-format=short 的 file:line:col 不被 ANSI 遮蔽。
        # 链接期诊断（ld/clang）本就是纯字面量、不受色码开关影响，但类型错误的
        # 位置信息全靠这里 + annotate 脚本的剥色兜底。
        env:
          CARGO_TERM_COLOR: never
        run: |
          # GitHub 默认 bash 是 `bash -eo pipefail`，-e 始终开着。显式关掉 -e，
          # 让 cargo 失败后仍能执行下面的注解逻辑；保留 pipefail 以便取管道退出码。
          set +e -o pipefail
          trap 'echo "::error::CARGO_UNCAUGHT rc=$? line=$LINENO"' ERR

          CARGO_LOG=/tmp/cargo-cross.log
          : > "$CARGO_LOG"

          # --message-format=short 让 rustc 把诊断压成单行
          # `path/to/f.rs:12:34: error[E0425]: ...`，注解里才留得住 file:line。
          # 链接期错误（ld/clang）不受该开关影响，仍是原样多行输出，由注解脚本
          # 的链接期正则单独捕获。
          build() {
            cargo build --release --target "$TARGET_TRIPLE" -p aidea -p aidea-gui \
              --message-format=short
          }

          # job 日志与 artifact 都要鉴权才能读，只有 annotations 是公开可读的。
          # 旧实现把 tail -60 压成**一条**注解，file:line 全被挤掉、错误被截断，
          # 只能靠 CI 往返挤牙膏。现统一交给 scripts/ci/annotate-cargo-errors.sh
          # 分批输出（该脚本恒以 0 退出，绝不会因诊断本身把步骤带挂）。
          emit_cargo_error() {
            bash scripts/ci/annotate-cargo-errors.sh "$CARGO_LOG" cargo_build
          }

          # 两轮构建都放进 if 条件里：bash 不会为「条件上下文中的命令」触发 ERR
          # trap，避免失败时先冒出一条自相矛盾的 CARGO_UNCAUGHT 注解。
          echo "::group::attempt 1 (repo release profile: lto=true, codegen-units=1)"
          rc=0
          if ! build 2>&1 | tee -a "$CARGO_LOG" /tmp/cargo1.log; then
            rc="${PIPESTATUS[0]}"
            if [ "$rc" -eq 0 ]; then rc=1; fi
          fi
          echo "::endgroup::"
          if [ "$rc" -eq 0 ]; then
            echo "ok"
          else
            echo "::warning::带 LTO 的构建失败（runner 常见 OOM），关闭 LTO 重试"
            echo "::group::attempt 2 (lto=off, codegen-units=256)"
            rc=0
            if ! CARGO_PROFILE_RELEASE_LTO=false \
                 CARGO_PROFILE_RELEASE_CODEGEN_UNITS=256 \
                 CARGO_PROFILE_RELEASE_INCREMENTAL=false \
                 build 2>&1 | tee -a "$CARGO_LOG" /tmp/cargo2.log; then
              rc="${PIPESTATUS[0]}"
              if [ "$rc" -eq 0 ]; then rc=1; fi
            fi
            echo "::endgroup::"
          fi

          if [ "$rc" -ne 0 ]; then
            emit_cargo_error
            echo "::error::cargo_build_failed rc=$rc (both attempts, lto on + lto off)"
            exit "$rc"
          fi

          # workspace 统一输出到仓库根 target/；兼容 gui/src-tauri/target/ 布局
          OUT=""
          for d in "target/${TARGET_TRIPLE}/release" "gui/src-tauri/target/${TARGET_TRIPLE}/release"; do
            if [ -f "$d/aidea-gui" ]; then OUT="$d"; break; fi
          done
          [ -n "$OUT" ] || { echo "::error::未找到 aidea-gui 产物"; find . -name 'aidea-gui' -type f | head; exit 1; }
          echo "CARGO_OUT_DIR=$OUT" >> "$GITHUB_ENV"

          file "$OUT/aidea-gui" "$OUT/aidea"
          file "$OUT/aidea-gui" | grep -qi "Mach-O 64-bit x86_64" \
            || echo "::warning::aidea-gui 不是预期的 Mach-O x86_64（请核对 file 输出）"

          # -e 已关闭，显式以 0 结束，避免最后一条命令的退出码误判本步骤
          exit 0

      - name: Upload cargo logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-logs
          path: |
            /tmp/cargo1.log
            /tmp/cargo2.log
          if-no-files-found: ignore
          retention-days: 7

      # -------------------------------------------------------------------
      - name: Assemble bundle payload
        run: |
          set -euo pipefail
          OUT="${CARGO_OUT_DIR}"
          STAGE="dist-bundle"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/payload/macos" "$STAGE/payload/bin" \
                   "$STAGE/payload/lib" "$STAGE/payload/share" "$STAGE/payload/icons"

          # ① 主二进制
          cp "$OUT/aidea-gui" "$STAGE/payload/macos/aidea-gui"
          chmod +x "$STAGE/payload/macos/aidea-gui"

          # ② sidecar：aidea 来自本次交叉编译；其余来自 .bundle/bin
          cp "$OUT/aidea" "$STAGE/payload/bin/aidea-${TARGET_TRIPLE}"
          if [ -d .bundle/bin ]; then cp -a .bundle/bin/. "$STAGE/payload/bin/"; fi
          chmod +x "$STAGE"/payload/bin/* 2>/dev/null || true

          # ③ 运行时依赖（postgres dylib / share；llama-server 为单二进制无需额外 runner）
          if [ -d .bundle/lib ];   then cp -a .bundle/lib/.   "$STAGE/payload/lib/";   fi
          if [ -d .bundle/share ]; then cp -a .bundle/share/. "$STAGE/payload/share/"; fi

          # ④ 前端 + Tauri 资源 + 图标
          cp -a gui/dist "$STAGE/payload/dist"
          cp -a gui/src-tauri/resources "$STAGE/payload/resources"
          if [ -f gui/src-tauri/icons/icon.png ]; then
            cp gui/src-tauri/icons/icon.png "$STAGE/payload/icons/icon.png"
          fi

          # ⑤ Info.plist 模板（package-dmg.sh 优先使用它，缺失时自行生成等价内容）
          cat > "$STAGE/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>CFBundleName</key><string>aidea</string>
          	<key>CFBundleDisplayName</key><string>aidea</string>
          	<key>CFBundleIdentifier</key><string>com.aidea.gui</string>
          	<key>CFBundleExecutable</key><string>aidea-gui</string>
          	<key>CFBundlePackageType</key><string>APPL</string>
          	<key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
          	<key>CFBundleVersion</key><string>0.1.0</string>
          	<key>CFBundleShortVersionString</key><string>0.1.0</string>
          	<key>CFBundleIconFile</key><string>icon.icns</string>
          	<key>LSMinimumSystemVersion</key><string>10.15</string>
          	<key>LSApplicationCategoryType</key><string>public.app-category.developer-tools</string>
          	<key>NSHighResolutionCapable</key><true/>
          	<key>NSPrincipalClass</key><string>NSApplication</string>
          	<key>CFBundleSupportedPlatforms</key>
          	<array><string>MacOSX</string></array>
          	<key>NSSupportsAutomaticGraphicsSwitching</key><true/>
          	<key>NSAppTransportSecurity</key>
          	<dict><key>NSAllowsLocalNetworking</key><true/></dict>
          </dict>
          </plist>
          PLIST

          # ⑥ 本机封包脚本 + 说明，随包一起发出，解包即用
          cp package-dmg.sh "$STAGE/package-dmg.sh"
          chmod +x "$STAGE/package-dmg.sh"
          if [ -f DMG_BUILD.md ]; then cp DMG_BUILD.md "$STAGE/DMG_BUILD.md"; fi

          # ⑦ 清单
          {
            echo "aidea macOS bundle"
            echo "built_at   : $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "commit     : ${GITHUB_SHA:-unknown}"
            echo "run        : ${GITHUB_RUN_ID:-unknown}"
            echo "triple     : ${TARGET_TRIPLE}"
            echo "min_macos  : ${MACOSX_DEPLOYMENT_TARGET}"
            echo "sdk        : $(basename "${SDKROOT:-unknown}")"
            echo "pg_major   : ${PG_MAJOR}"
            if [ -f "$STAGE/payload/resources/models/nes-tab/qwen2.5-0.5b.gguf" ]; then
              echo "model_gguf : bundled (offline ready)"
            else
              echo "model_gguf : absent (first-run online pull)"
            fi
          } > "$STAGE/MANIFEST.txt"
          cat "$STAGE/MANIFEST.txt"

          echo "--- payload tree (depth 3) ---"
          find "$STAGE" -maxdepth 3 | sort | head -60

          tar -czf aidea-bundle.tar.gz -C "$STAGE" .
          ls -lh aidea-bundle.tar.gz

      # -------------------------------------------------------------------
      # 产物真实性门禁（run #17 新增）—— "编出来了" ≠ "能跑"。
      #
      # 586.22 MiB 只证明打包步骤跑完了，完全没有证明二进制能在真实 Intel Mac
      # 上启动。Linux runner 无法**执行** Mach-O，但可以**静态检查**：
      #   B1 cputype 必须 x86_64（用户机是 Intel，出 arm64 整个包作废）
      #   B2 minos 必须 10.15 ← 最重要。链接成功 ≠ deployment target 生效；
      #      若 ld64 把 minos 静默提到 26.1，dyld 会在用户机上直接拒绝启动，
      #      而 CI 永远发现不了。**硬失败，绝不降级为 warning。**
      #   B3 LC_LOAD_DYLIB 不得泄漏构建机本地路径
      #   B4 两个二进制存在且体积超阈值
      # 断言实现与自测见 scripts/ci/verify-macho.sh（`--self-test` 可离线跑）。
      #
      # 本步骤失败 ⇒ 后面的 Upload 不执行，坏包**不会**流到用户手里。
      # -------------------------------------------------------------------
      - name: Verify Mach-O artifacts & payload inventory (gate before upload)
        run: |
          set +e -o pipefail
          trap 'echo "::error::MACHO_VERIFY_UNCAUGHT rc=$? line=$LINENO"' ERR

          STAGE="dist-bundle"

          # ---- C3：把 586 MiB 归因到各顶层目录，写进注解 --------------------
          # 纯诊断，全部 `|| true`：绝不因统计失败把门禁步骤带挂。
          echo "::group::payload inventory"
          du -sh "$STAGE"/payload/* 2>/dev/null | sort -h || true
          echo "--- stage total / tarball ---"
          du -sh "$STAGE" 2>/dev/null || true
          ls -lh aidea-bundle.tar.gz 2>/dev/null || true
          echo "::endgroup::"

          INV="$(du -sk "$STAGE"/payload/* 2>/dev/null \
                 | awk '{ n = $2; sub(/.*\//, "", n); printf "%s=%.1fMB ", n, $1/1024 }' || true)"
          TARB="$(wc -c < aidea-bundle.tar.gz 2>/dev/null | tr -d ' ' || true)"
          echo "::notice::bundle_inventory ${INV}tarball=$(awk -v b="${TARB:-0}" 'BEGIN{ printf "%.1fMB", b/1048576 }')"

          # ---- parser 自测（非阻断）-----------------------------------------
          # 本地是 macOS 的 BSD awk，runner 上是 mawk。fat header 解析、
          # (architecture X): 切段、版本号数值比较这几处都吃 awk 方言，
          # 在真正下断言之前先用模拟数据在**runner 自己的 awk** 上对一遍答案。
          #
          # 刻意**不 gate**：本轮的首要目的是拿到 5 个 sidecar 的架构事实，
          # 若自测因方言问题翻红，反而拿不到那批事实。失败只出 warning，
          # 由我在汇报里跟进。真正的门禁仍是下面的 B1~B4。
          echo "::group::verify-macho parser self-test (mawk)"
          if bash scripts/ci/verify-macho.sh --self-test; then
            echo "self-test OK on $(awk --version 2>/dev/null | head -1 || echo 'mawk/unknown')"
          else
            echo "::warning::macho_check: parser 自测在 runner 的 awk 上未全绿 —— 下面的 cputype/minos 判定可能不可信，请以本组日志为准复核（本步骤不因此阻断）。"
          fi
          echo "::endgroup::"

          # ---- B1~B4：对**实际入包**的两个二进制做断言（strict 模式）--------
          rc=0
          bash scripts/ci/verify-macho.sh "x86_64" "${MACOSX_DEPLOYMENT_TARGET}" \
            "aidea-gui=${STAGE}/payload/macos/aidea-gui" \
            "aidea=${STAGE}/payload/bin/aidea-${TARGET_TRIPLE}" || rc=$?

          # ---- run #18 新增：5 个上游 sidecar 的架构断言（sidecar 模式）-----
          #
          # 为什么必须加：上面两个二进制合计 17.4MB，占包体不到 3%。包里另外
          # 5 个同样要在用户 Intel Mac 上执行的 Mach-O 全部来自上游下载
          # （llama-server 由 osxcross 交叉编译、Postgres.app 的 dmg），架构从未检查过。
          # Postgres.app / llama-server 近年版本完全可能是 arm64-only 或 universal —— 
          # 若是 arm64-only，用户 Intel 机上数据库或推理**启动即失败**，
          # 而此前所有断言照样全绿。占包体 95% 以上的部分等于零监控。
          #
          # 口径（与主二进制刻意不同，见 verify-macho.sh 头部注释）：
          #   B1 架构 : 必须含 x86_64 slice（thin x86_64 或 universal）⇒ 硬失败
          #   B2 minos: **只打印不 gate**。上游 deployment target 非我方可控，
          #             拿 10.15 硬 gate 会误杀；高于目标时只补一条 warning。
          #   B3 泄漏 : 只记录不 gate（上游 install name 非我方可控）
          #   B4 体积 : 下限降到 16 KiB（pg 工具本就小，2 MiB 会误杀）
          #
          # ⚠️ 若某个 sidecar 是 arm64-only：这里会**硬失败**并把事实打进注解。
          #    这是刻意的 —— 不自动改下载源，先拿到事实再决定对策。
          bash scripts/ci/verify-macho.sh --sidecar "x86_64" "${MACOSX_DEPLOYMENT_TARGET}" \
            "llama_server=${STAGE}/payload/bin/llama-server-${TARGET_TRIPLE}" \
            "postgres=${STAGE}/payload/bin/postgres-${TARGET_TRIPLE}" \
            "initdb=${STAGE}/payload/bin/initdb-${TARGET_TRIPLE}" \
            "pg_ctl=${STAGE}/payload/bin/pg_ctl-${TARGET_TRIPLE}" \
            "psql=${STAGE}/payload/bin/psql-${TARGET_TRIPLE}" || rc=$?

          exit "$rc"

      # -------------------------------------------------------------------
      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: aidea-bundle
          path: aidea-bundle.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Next steps
        run: |
          echo "下载 Artifact「aidea-bundle」并解压得到 aidea-bundle.tar.gz，然后在本机 macOS 执行："
          echo "    bash package-dmg.sh aidea-bundle.tar.gz"
          echo "即可在当前目录得到 aidea.dmg（全程只用 hdiutil/codesign，不触发 Spotlight/mds）。"
